<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WANPLAN — Offline</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
         background: linear-gradient(160deg, #1e1b4b 0%, #312e81 50%, #6d28d9 100%);
         color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; }
  .wrap { padding: 2rem; max-width: 22rem; }
  img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 14px 44px rgba(0,0,0,.35);
        background: #fff; padding: 8px; }
  h1 { font-size: 2.2rem; letter-spacing: -.04em; margin: 1rem 0 .25rem; }
  .tag { text-transform: uppercase; letter-spacing: .16em; font-size: .72rem; opacity: .7; }
  p { opacity: .85; margin: 1rem 0 1.5rem; }
  button { background: #fff; color: #4f46e5; border: 0; padding: .8rem 1.8rem; border-radius: 12px;
           font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/wans/static/icon-192.png" alt="WANPLAN">
    <h1>You're offline</h1>
    <div class="tag">WANPLAN · wanland planner</div>
    <p>Reconnect to the internet to keep using your workspace.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
