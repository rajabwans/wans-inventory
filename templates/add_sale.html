{% extends "base.html" %}
{% block title %}New Sale{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white"><h5 class="mb-0 fw-bold"><i class="bi bi-cart-plus"></i> Record New Sale</h5></div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Product *</label>
                            <div class="input-group mb-2">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" id="productSearch" class="form-control" placeholder="Type to search products..." autocomplete="off">
                                <button type="button" class="btn btn-outline-secondary" onclick="clearSearch()" title="Clear"><i class="bi bi-x-lg"></i></button>
                            </div>
                            <div class="text-muted small mb-1" id="matchCount"></div>
                            <select name="product_id" class="form-select" required id="productSelect" onchange="updatePrice()" size="8" style="font-size:.95rem;">
                                <option value="">Select product...</option>
                                {% for p in products %}
                                <option value="{{ p.id }}" data-price="{{ p.selling_price }}" data-buy="{{ p.buying_price }}" data-stock="{{ p.quantity }}" data-cat="{{ p.category or '' }}">
                                    {{ p.title }} (Stock: {{ p.quantity }}) - {{ CURRENCY }} {{ "{:,.0f}".format(p.selling_price) }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Customer</label>
                            <select name="customer_id" class="form-select">
                                <option value="">Walk-in customer</option>
                                {% for c in customers %}
                                <option value="{{ c.id }}">{{ c.name }}{% if c.phone %} ({{ c.phone }}){% endif %}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Or Customer Name</label>
                            <input type="text" name="customer_name" class="form-control" placeholder="Quick entry">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Quantity *</label>
                            <input type="number" name="quantity" class="form-control" value="1" min="1" required id="qtyInput" onchange="calcTotal()">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Unit Price ({{ CURRENCY }}) *</label>
                            <input type="number" step="1" name="unit_price" class="form-control" value="0" min="0" required id="priceInput" onchange="calcTotal()">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Total</label>
                            <input type="text" class="form-control" id="totalDisplay" readonly value="{{ CURRENCY }} 0">
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-dark"><i class="bi bi-check-lg"></i> Record Sale</button>
                        <a href="{{ url_for('sales') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
var searchInput = document.getElementById('productSearch');
var selectEl = document.getElementById('productSelect');

function getOptions() {
    return Array.prototype.slice.call(selectEl.options).filter(function(o) { return o.value !== ''; });
}

function updatePrice() {
    var sel = document.getElementById('productSelect');
    var opt = sel.options[sel.selectedIndex];
    if (opt && opt.value) {
        document.getElementById('priceInput').value = opt.dataset.price;
        calcTotal();
        document.getElementById('qtyInput').focus();
        document.getElementById('qtyInput').select();
    }
}

function calcTotal() {
    var qty = parseInt(document.getElementById('qtyInput').value) || 0;
    var price = parseFloat(document.getElementById('priceInput').value) || 0;
    document.getElementById('totalDisplay').value = '{{ CURRENCY }} ' + (qty * price).toLocaleString();
}

function filterProducts() {
    var q = (searchInput.value || '').toLowerCase().trim();
    var visible = 0;
    var firstMatchId = null;
    // hide the placeholder when searching so users can't submit it
    selectEl.options[0].style.display = q ? 'none' : '';
    getOptions().forEach(function(o) {
        var hay = (o.textContent + ' ' + (o.dataset.cat || '')).toLowerCase();
        var match = !q || hay.indexOf(q) !== -1;
        o.style.display = match ? '' : 'none';
        if (match) {
            visible++;
            if (!firstMatchId) firstMatchId = o.value;
        }
    });
    document.getElementById('matchCount').textContent = q
        ? visible + ' match' + (visible === 1 ? '' : 'es') + (visible ? ' — press Enter for first match' : ' — nothing found')
        : '';
    if (q && firstMatchId) {
        selectEl.value = firstMatchId;
        selectEl.dispatchEvent(new Event('change'));
    }
}

function clearSearch() {
    searchInput.value = '';
    filterProducts();
    searchInput.focus();
}

searchInput.addEventListener('input', filterProducts);
searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        var v = selectEl.value;
        if (v) {
            updatePrice();
        }
    }
});
document.addEventListener('DOMContentLoaded', filterProducts);
</script>
{% endblock %}
