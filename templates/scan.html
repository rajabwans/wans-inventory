{% extends "base.html" %}
{% block title %}Scan Barcode{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white"><h5 class="mb-0 fw-bold"><i class="bi bi-upc-scan"></i> Scan Barcode</h5></div>
            <div class="card-body">
                <div id="scannerBox" class="mb-3" style="min-height:300px;background:#111;border-radius:12px;position:relative;overflow:hidden;">
                    <div id="scannerPlaceholder" class="d-flex flex-column align-items-center justify-content-center h-100 text-white">
                        <i class="bi bi-camera-video fs-1 mb-2"></i>
                        <p>Tap "Start Scanner" to begin</p>
                    </div>
                </div>
                <div class="d-flex gap-2 mb-3">
                    <button id="startBtn" class="btn btn-brand flex-fill" onclick="startScan()"><i class="bi bi-camera-video me-1"></i> Start Scanner</button>
                    <button id="stopBtn" class="btn btn-outline-danger flex-fill" onclick="stopScan()" style="display:none"><i class="bi bi-stop-circle me-1"></i> Stop</button>
                    <button id="torchBtn" class="btn btn-outline-secondary" onclick="toggleTorch()" title="Toggle flashlight"><i class="bi bi-lightbulb"></i></button>
                </div>
                <hr>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Or enter barcode manually</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-keyboard"></i></span>
                        <input type="text" id="manualBarcode" class="form-control" placeholder="Type or paste barcode..." autofocus>
                        <button class="btn btn-brand" onclick="lookupBarcode(document.getElementById('manualBarcode').value)"><i class="bi bi-search"></i> Lookup</button>
                    </div>
                </div>
                <div id="scanResult" class="d-none">
                    <div class="alert alert-success"><i class="bi bi-check-circle me-1"></i> Product found!</div>
                    <div class="card">
                        <div class="card-body">
                            <h5 id="resultTitle" class="fw-bold mb-1"></h5>
                            <p class="text-muted small mb-2" id="resultCategory"></p>
                            <div class="row g-2">
                                <div class="col-4"><span class="small text-muted">Stock</span><br><strong id="resultStock"></strong></div>
                                <div class="col-4"><span class="small text-muted">Buy Price</span><br><strong id="resultBuy"></strong></div>
                                <div class="col-4"><span class="small text-muted">Sell Price</span><br><strong id="resultSell"></strong></div>
                            </div>
                            <div class="d-flex gap-2 mt-3">
                                <a id="resultEdit" href="#" class="btn btn-outline-primary btn-sm"><i class="bi bi-pencil"></i> Edit</a>
                                <a id="resultSale" href="#" class="btn btn-brand btn-sm"><i class="bi bi-cart-plus"></i> Sell</a>
                                <a id="resultPrint" href="#" class="btn btn-outline-success btn-sm" title="Print receipt"><i class="bi bi-printer"></i></a>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="scanNotFound" class="d-none">
                    <div class="alert alert-warning"><i class="bi bi-exclamation-triangle me-1"></i> No product found with this barcode.</div>
                    <a id="addNewLink" href="#" class="btn btn-outline-brand"><i class="bi bi-plus-lg"></i> Add as new product</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='barcode-scanner.js') }}"></script>
<script>
function startScan() {
    document.getElementById('scannerPlaceholder').style.display = 'none';
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = '';
    WanScan.start(document.getElementById('scannerBox'), function(code) {
        document.getElementById('manualBarcode').value = code;
        lookupBarcode(code);
        stopScan();
    });
}
function stopScan() {
    WanScan.stop();
    document.getElementById('scannerPlaceholder').style.display = '';
    document.getElementById('startBtn').style.display = '';
    document.getElementById('stopBtn').style.display = 'none';
}
function toggleTorch() { WanScan.torch(); }
function lookupBarcode(code) {
    if (!code || !code.trim()) return;
    code = code.trim();
    document.getElementById('scanResult').classList.add('d-none');
    document.getElementById('scanNotFound').classList.add('d-none');
    fetch('{{ url_for("api_scan_barcode") }}?barcode=' + encodeURIComponent(code))
        .then(r => r.json())
        .then(data => {
            if (data.found) {
                document.getElementById('resultTitle').textContent = data.product.title;
                document.getElementById('resultCategory').textContent = data.product.category || 'Uncategorized';
                document.getElementById('resultStock').textContent = data.product.quantity + ' units';
                document.getElementById('resultBuy').textContent = '{{ CURRENCY }} ' + Number(data.product.buying_price).toLocaleString();
                document.getElementById('resultSell').textContent = '{{ CURRENCY }} ' + Number(data.product.selling_price).toLocaleString();
                document.getElementById('resultEdit').href = '{{ url_for("edit_product", id=0) }}'.replace('/0', '/' + data.product.id);
                document.getElementById('resultSale').href = '{{ url_for("add_sale") }}?product_id=' + data.product.id;
                document.getElementById('scanResult').classList.remove('d-none');
            } else {
                document.getElementById('addNewLink').href = '{{ url_for("add_product") }}?barcode=' + encodeURIComponent(code);
                document.getElementById('scanNotFound').classList.remove('d-none');
            }
        })
        .catch(err => { alert('Error looking up barcode: ' + err.message); });
}
document.getElementById('manualBarcode').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); lookupBarcode(this.value); }
});
</script>
{% endblock %}
