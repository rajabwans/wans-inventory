{% extends "base.html" %}
{% block title %}Add Product{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 760px;">
    <div class="form-page-header mb-4">
        <div class="d-flex align-items-center gap-3">
            <span class="step-icon"><i class="bi bi-plus-lg"></i></span>
            <div>
                <h4 class="page-title mb-0">Add New Product</h4>
                <p class="page-sub mb-0">Create a product so you can track its stock and sales</p>
            </div>
        </div>
        <a href="{{ url_for('products') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
    </div>

    <div class="card">
        <div class="card-body p-4">
            <form method="POST" data-offline-op="product" data-offline-return="/wans/products">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="row g-3">
                    <div class="col-12">
                        <label class="field-label"><i class="bi bi-box-seam me-1"></i>Product name</label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-tag"></i>
                            <input type="text" name="title" class="form-control form-control-lg" placeholder="e.g. Perfume 100ml" required autofocus>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="field-label"><i class="bi bi-collection me-1"></i>Category</label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-grid"></i>
                            <select name="category" class="form-select">
                                <option value="">No category</option>
                                {% for c in categories %}
                                <option>{{ c.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="field-label"><i class="bi bi-hash me-1"></i>Quantity in stock</label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-boxes"></i>
                            <input type="number" name="quantity" class="form-control" value="0" min="0" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="field-label"><i class="bi bi-cart-dash me-1"></i>Buying price (cost)</label>
                        <div class="input-icon-wrap currency">
                            <span class="input-currency-prefix" id="currencyPrefixBuy">{{ CURRENCY }}</span>
                            <input type="number" step="1" name="buying_price" id="buyingPrice" class="form-control" value="0" min="0" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="field-label"><i class="bi bi-cart-plus me-1"></i>Selling price</label>
                        <div class="input-icon-wrap currency">
                            <span class="input-currency-prefix" id="currencyPrefixSell">{{ CURRENCY }}</span>
                            <input type="number" step="1" name="selling_price" id="sellingPrice" class="form-control" value="0" min="0" required>
                        </div>
                    </div>

                    <div class="col-12 mt-4">
                        <div class="margin-banner" id="marginBanner">
                            <span class="margin-dot"><i class="bi bi-graph-up-arrow"></i></span>
                            <div>
                                <span class="hint d-block">Profit per unit</span>
                                <span class="value" id="marginValue">{{ CURRENCY }} 0</span>
                            </div>
                            <span class="ms-auto badge bg-white text-dark" id="marginPct">0%</span>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-brand px-4"><i class="bi bi-check-lg me-1"></i>Save Product</button>
                    <a href="{{ url_for('products') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function () {
    const buy = document.getElementById('buyingPrice');
    const sell = document.getElementById('sellingPrice');
    const val = document.getElementById('marginValue');
    const pct = document.getElementById('marginPct');
    const banner = document.getElementById('marginBanner');
    const CUR = '{{ CURRENCY }}';
    function update() {
        const b = parseFloat(buy.value) || 0;
        const s = parseFloat(sell.value) || 0;
        const m = s - b;
        val.textContent = CUR + ' ' + m.toLocaleString();
        pct.textContent = b > 0 ? Math.round((m / b) * 100) + '%' : '—';
        const neg = m < 0;
        pct.classList.toggle('text-danger', neg);
        banner.classList.toggle('negative', neg);
    }
    buy.addEventListener('input', update);
    sell.addEventListener('input', update);
})();
</script>
{% endblock %}
