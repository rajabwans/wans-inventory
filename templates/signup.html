{% extends "base.html" %}
{% block title %}Register your business{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-3">
                    <i class="bi bi-building-add fs-1 text-primary"></i>
                    <h5 class="fw-bold mt-2">Register your business</h5>
                    <p class="text-muted small">Create your workspace in under a minute</p>
                </div>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Business name</label>
                        <input type="text" name="business_name" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Business slug</label>
                        <input type="text" name="slug" class="form-control" placeholder="e.g. my-shop" required>
                        <div class="form-text">Used to log in: yourslug + your username</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Currency</label>
                        <select name="currency" class="form-select" required>
                            {% for code in ['UGX','KES','TZS','USD','EUR','GBP','NGN','ZAR','GHS','RWF','XOF'] %}
                            <option value="{{ code }}">{{ code }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <hr>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Admin username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Full name</label>
                        <input type="text" name="full_name" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" minlength="6" required>
                        <div class="form-text">At least 6 characters</div>
                    </div>
                    <button type="submit" class="btn btn-dark w-100"><i class="bi bi-check-circle"></i> Create business</button>
                    <p class="text-center text-muted small mt-3 mb-0">
                        Already registered? <a href="{{ url_for('login') }}">Login</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
