{% extends "auth_base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="text-center mb-4 d-lg-none">
    <div class="auth-logo mx-auto mb-2" style="width:76px;height:76px;padding:7px;border-radius:20px;"><img src="{{ url_for('static', filename='logo.svg') }}" alt="{{ PRODUCT_NAME }}"></div>
    <div class="fw-bolder" style="font-size:2.1rem;line-height:1;letter-spacing:-.04em;">{{ PRODUCT_NAME }}</div>
    <div class="small text-muted text-uppercase" style="letter-spacing:.16em;">wanland planner</div>
</div>
<div class="text-center mb-4">
    <h2 class="mb-1">Welcome back</h2>
    <p class="lead mb-0">Sign in to your business workspace</p>
</div>
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="mb-3">
        <label class="form-label">Business slug</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-building"></i></span>
            <input type="text" name="slug" class="form-control" value="{{ slug or '' }}" placeholder="e.g. wans" required>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Username</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
    </div>
    <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" required>
        </div>
    </div>
    <button type="submit" class="btn btn-brand w-100 py-2"><i class="bi bi-box-arrow-in-right me-1"></i>Sign in</button>
    <p class="text-center text-muted small mt-3 mb-0">
        New business? <a href="{{ url_for('signup') }}" class="fw-semibold">Create your workspace</a>
    </p>
</form>
{% endblock %}
