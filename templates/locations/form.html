{% extends "base.html" %}
{% block title %}{{ 'Edit' if location else 'Add' }} Location{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white"><h5 class="mb-0 fw-bold"><i class="bi bi-geo-alt"></i> {{ 'Edit' if location else 'Add' }} Location</h5></div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label class="form-label">Name *</label>
                        <input type="text" name="name" class="form-control" value="{{ location.name if location else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input type="text" name="address" class="form-control" value="{{ location.address if location else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control" value="{{ location.phone if location else '' }}">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_default" class="form-check-input" id="isDefault" {{ 'checked' if location and location.is_default else '' }}>
                        <label class="form-check-label" for="isDefault">Set as default location</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-brand"><i class="bi bi-check-lg"></i> Save</button>
                        <a href="{{ url_for('locations') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
